
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout com Grid</title>

    <style>
        * {
            border: 1px solid black;
            box-sizing: border-box;
        }

        .main {
            display: grid;

            grid-template-areas:
                "header header header"
                "menu section aside"
                "footer footer footer";

            grid-template-columns: repeat(3, 1fr);
            height: 20vh;
          
        }

        header {
            grid-area: header;
        }

        menu {
            grid-area: menu;
        }

        section {
            grid-area: section;
        }

        aside {
            grid-area: aside;
        }

        footer {
            grid-area: footer;
        }
        .a{
            animation: pula 4s linear 0s infinite;
        }
        @keyframes pula {
            0%{
                transform: translate(0,0);
                color: black;
                font-size: 20px;
            }
            10%{
                transform: translate(30px,30px);
                color: aquamarine;
                font-size: 40px;
            }
            20%{
                transform: translate(60px,0);
                color: blueviolet;
                font-size: 90px;
            }
            30%{
                transform: translate(80px,30px);
                color: brown;
                font-size: 120px;
            }
             40%{
                transform: translate(100px,0px);
                color: green;
                font-size: 150px;
            }
        }
    </style>
</head>

<body>
    <div class="main">
        <header class="a">Header</header>
        <menu>Menu</menu>
        <section>Seção</section>
        <aside>Aside</aside>
        <footer>Rodapé</footer>
    </div>
</body>
</html>

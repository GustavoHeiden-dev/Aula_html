<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Incluir CSS</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        .interno {
            color: green;
        }
    </style>
</head>
<body>
    <h1>Formas de incluir CSS</h1>
    <p style="color: red;">CSS inline: utiliza o atributo style no elemento.</p>
    <p class="interno">CSS interno: utiliza a tag style dentro do head.</p>
    <p class="externo">CSS externo: utiliza um arquivo CSS ligado pela tag link.</p>
</body>
</html>

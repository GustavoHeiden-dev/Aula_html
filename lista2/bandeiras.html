<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandeiras</title>
    <style>
        .bandeira {
            width: 400px;
            height: 200px;
            position: relative;
            border: 1px solid black;
            margin-bottom: 20px;
        }

        #japao.bandeira {
            background-color: white;
        }

        #japao.bandeira > div.circulo {
            background-color: red;
            width: 100px;
            height: 100px;
            position: absolute;
            left: 150px;
            top: 50px;
            border-radius: 50%;
        }

        #alemanha.bandeira > div.linha1 {
            height: 33.333%;
            background-color: black;
        }

        #alemanha.bandeira > div.linha2 {
            height: 33.333%;
            background-color: red;
        }

        #alemanha.bandeira > div.linha3 {
            height: 33.333%;
            background-color: yellow;
        }

        #holanda.bandeira > div.linha1 {
            height: 33.333%;
            background-color: red;
        }

        #holanda.bandeira > div.linha2 {
            height: 33.333%;
            background-color: white;
        }

        #holanda.bandeira > div.linha3 {
            height: 33.333%;
            background-color: blue;
        }

        #italia.bandeira > div.linha1 {
            width: 33.333%;
            height: 200px;
            background-color: green;
            float: left;
        }

        #italia.bandeira > div.linha2 {
            width: 33.333%;
            height: 200px;
            background-color: white;
            float: left;
        }

        #italia.bandeira > div.linha3 {
            width: 33.333%;
            height: 200px;
            background-color: red;
            float: left;
        }

        #brasil.bandeira {
            background-color: green;
        }

        #brasil.bandeira > div.losango {
            width: 340px;
            height: 170px;
            background-color: yellow;
            position: absolute;
            left: 30px;
            top: 15px;
            clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
        }

        #brasil.bandeira > div.circulo {
            width: 100px;
            height: 100px;
            background-color: blue;
            position: absolute;
            left: 150px;
            top: 50px;
            border-radius: 50%;
            overflow: hidden;
        }

        #brasil.bandeira > div.circulo > div.faixa {
            width: 120px;
            height: 15px;
            background-color: white;
            position: absolute;
            left: -10px;
            top: 35px;
            font-size: 8px;
            text-align: center;
            line-height: 15px;
            color: green;
        }
    </style>
</head>
<body>
    <a href="#japao">Bandeira Japão</a>
    <a href="#alemanha">Bandeira Alemanha</a>
    <a href="#holanda">Bandeira Holanda</a>
    <a href="#italia">Bandeira Itália</a>
    <a href="#brasil">Bandeira Brasil</a>

    <h2>Japão</h2>
    <div class="bandeira" id="japao">
        <div class="circulo"></div>
    </div>

    <h2>Alemanha</h2>
    <div class="bandeira" id="alemanha">
        <div class="linha1"></div>
        <div class="linha2"></div>
        <div class="linha3"></div>
    </div>

    <h2>Holanda</h2>
    <div class="bandeira" id="holanda">
        <div class="linha1"></div>
        <div class="linha2"></div>
        <div class="linha3"></div>
    </div>

    <h2>Itália</h2>
    <div class="bandeira" id="italia">
        <div class="linha1"></div>
        <div class="linha2"></div>
        <div class="linha3"></div>
    </div>

    <h2>Brasil</h2>
    <div class="bandeira" id="brasil">
        <div class="losango"></div>
        <div class="circulo">
            <div class="faixa">ORDEM E PROGRESSO</div>
            
        </div>
    </div>
</body>
</html>

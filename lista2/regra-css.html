<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Regra CSS</title>
    <style>
        p {
            color: blue;
        }
    </style>
</head>
<body>
    <h1>Regra CSS</h1>
    <p>Uma regra CSS define a aparência dos elementos HTML.</p>
    <p>No exemplo p é o seletor, color é a propriedade e blue é o valor.</p>
</body>
</html>

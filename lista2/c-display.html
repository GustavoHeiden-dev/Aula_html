<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Positions</title>
    <style>
        body {
            margin: 0;
        }

        .area {
            position: relative;
            height: 100vh;
        }

        .caixa {
            position: absolute;
            width: 100px;
            height: 100px;
        }

        .um {
            top: 0;
            left: 0;
            background-color: red;
        }

        .dois {
            top: 0;
            right: 0;
            background-color: yellow;
        }

        .tres {
            bottom: 0;
            right: 0;
            background-color: green;
        }

        .quatro {
            bottom: 0;
            left: 0;
            background-color: blue;
        }

        .cinco {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: magenta;
        }
    </style>
</head>
<body>
    <div class="area">
        <div class="caixa um">box1</div>
        <div class="caixa dois">box2</div>
        <div class="caixa tres">box3</div>
        <div class="caixa quatro">box4</div>
        <div class="caixa cinco">box5</div>
    </div>

    <p>O position relative define a referência para as caixas com position absolute. Top, bottom, left e right posicionam as caixas nos cantos. A quinta caixa fica centralizada com 50% e translate.</p>
</body>
</html>

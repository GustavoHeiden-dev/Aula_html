<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Display em blocos</title>
    <style>
        body {
            margin: 0;
        }

        .caixa {
            display: block;
            height: 25vh;
            text-align: center;
            line-height: 25vh;
        }

        .um { background-color: #6600ff; }
        .dois { background-color: #009900; }
        .tres { background-color: red; }
        .quatro { background-color: #eeff33; }
    </style>
</head>
<body>
    <div class="caixa um">1</div>
    <div class="caixa dois">2</div>
    <div class="caixa tres">3</div>
    <div class="caixa quatro">4</div>

    <p>O display block coloca cada caixa em uma nova linha. Cada caixa ocupa toda a largura e um quarto da altura da janela.</p>
</body>
</html>

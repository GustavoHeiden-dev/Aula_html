<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        .galeria {
            display: flex;
            gap: 10px;
            width: 90%;
            height: 400px;
            margin: 50px auto;
        }

        .imagem {
            flex: 1;
            min-width: 0;
            position: relative;
            overflow: hidden;
            border-radius: 40px;
            transition: flex 0.5s;
        }

        .imagem:hover {
            flex: 6;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        span {
            position: absolute;
            bottom: 15px;
            left: 10px;
            background-color: white;
            padding: 10px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="galeria">
        <div class="imagem">
            <img src="https://picsum.photos/id/10/800/600" alt="Paisagem">
            <span>*</span>
        </div>

        <div class="imagem">
            <img src="https://picsum.photos/id/15/800/600" alt="Cachoeira">
            <span>*</span>
        </div>

        <div class="imagem">
            <img src="https://picsum.photos/id/28/800/600" alt="Floresta">
            <span>♣</span>
        </div>

        <div class="imagem">
            <img src="https://picsum.photos/id/29/800/600" alt="Montanhas">
            <span>♦</span>
        </div>

        <div class="imagem">
            <img src="https://picsum.photos/id/16/800/600" alt="Mar">
            <span>*</span>
        </div>
    </div>
</body>
</html>
